name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to deploy to Pages (and enable it on first run).
permissions:
  contents: read
  pages: write
  id-token: write

# One Pages deploy at a time; let a newer push supersede an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # reads packageManager (pnpm@9) from package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true # enable Pages (build type: GitHub Actions) if not already
      - run: pnpm install --frozen-lockfile
      - name: Build static export
        run: pnpm build
        env:
          STATIC_EXPORT: "1" # turns on output:export + /sucstrat basePath (see next.config.ts)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
